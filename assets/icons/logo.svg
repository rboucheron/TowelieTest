<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Fond -->
    <rect width="200" height="200" fill="#F8FAFE"/>

    <!-- Cercle de base -->
    <circle cx="100" cy="100" r="85" fill="#E3F2FD" stroke="#87CEEB" stroke-width="3"/>

    <!-- Support/Base du laboratoire -->
    <ellipse cx="100" cy="160" rx="60" ry="8" fill="#B3D9FF" opacity="0.6"/>

    <!-- Éprouvette 1 (gauche) -->
    <g transform="translate(70, 100)">
        <!-- Corps de l'éprouvette -->
        <rect x="-8" y="-20" width="16" height="50" rx="8" fill="none" stroke="#4FC3F7" stroke-width="2"/>
        <!-- Liquide bleu -->
        <rect x="-6" y="10" width="12" height="18" rx="6" fill="#87CEEB"/>
        <!-- Bouchon -->
        <rect x="-10" y="-25" width="20" height="8" rx="4" fill="#64B5F6" stroke="#42A5F5" stroke-width="1"/>
        <!-- Bulles -->
        <circle cx="0" cy="5" r="1.5" fill="#B3E5FC" opacity="0.8"/>
        <circle cx="-3" cy="15" r="1" fill="#B3E5FC" opacity="0.6"/>
        <circle cx="2" cy="20" r="0.8" fill="#B3E5FC" opacity="0.7"/>
    </g>

    <!-- Éprouvette 2 (centre) -->
    <g transform="translate(100, 95)">
        <!-- Corps de l'éprouvette -->
        <rect x="-8" y="-25" width="16" height="55" rx="8" fill="none" stroke="#4FC3F7" stroke-width="2"/>
        <!-- Liquide bleu plus foncé -->
        <rect x="-6" y="5" width="12" height="23" rx="6" fill="#5DADE2"/>
        <!-- Bouchon -->
        <rect x="-10" y="-30" width="20" height="8" rx="4" fill="#64B5F6" stroke="#42A5F5" stroke-width="1"/>
        <!-- Bulles -->
        <circle cx="2" cy="0" r="1.5" fill="#B3E5FC" opacity="0.8"/>
        <circle cx="-2" cy="10" r="1.2" fill="#B3E5FC" opacity="0.6"/>
        <circle cx="1" cy="18" r="0.8" fill="#B3E5FC" opacity="0.7"/>
    </g>

    <!-- Éprouvette 3 (droite) -->
    <g transform="translate(130, 105)">
        <!-- Corps de l'éprouvette -->
        <rect x="-8" y="-15" width="16" height="45" rx="8" fill="none" stroke="#4FC3F7" stroke-width="2"/>
        <!-- Liquide bleu clair -->
        <rect x="-6" y="15" width="12" height="13" rx="6" fill="#B3E5FC"/>
        <!-- Bouchon -->
        <rect x="-10" y="-20" width="20" height="8" rx="4" fill="#64B5F6" stroke="#42A5F5" stroke-width="1"/>
        <!-- Bulles -->
        <circle cx="-1" cy="10" r="1" fill="#E1F5FE" opacity="0.8"/>
        <circle cx="2" cy="20" r="0.8" fill="#E1F5FE" opacity="0.6"/>
    </g>

</svg>
