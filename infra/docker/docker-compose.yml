services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: towelie_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-towelie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-towelie}
      POSTGRES_DB: ${POSTGRES_DB:-towelie}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-towelie} -d ${POSTGRES_DB:-towelie}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: towelie_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-towelie}:${POSTGRES_PASSWORD:-towelie}@postgres:5432/${POSTGRES_DB:-towelie}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-http://localhost:3000}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-admin@towelie.test}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD}
      SEED_SUPERADMIN_FIRSTNAME: ${SEED_SUPERADMIN_FIRSTNAME:-Towelie}
      SEED_SUPERADMIN_LASTNAME: ${SEED_SUPERADMIN_LASTNAME:-Admin}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  website:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
      args:
        API_URL: ${API_URL:-http://localhost:8000}
    container_name: towelie_website
    ports:
      - "${WEBSITE_PORT:-3000}:3000"
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:8000}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
