frontend_controllers:
    resource:
        path: ../src/Frontend/Controller/
        namespace: App\Frontend\Controller
    type: attribute



github_connect:
    path: /connect/github
    controller: App\Security\Controller\GithubAuthController::connect

github_check:
    path: /connect/github/check
    controller: App\Security\Controller\GithubAuthController::check
auth_login:
    path: /auth/login
    controller: App\Security\Controller\AuthController::login
